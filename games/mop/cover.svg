<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Cover of the whole project: chapter 1 (the atrium) on the left, chapter 2 (the bunker door) on the right.
       Rendered by scripts/render-cover.js with this folder as the argument, into cover.png here -->
  <defs>
    <clipPath id="left">
      <path d="M0 0 H700 L560 720 H0 Z"/>
    </clipPath>
    <clipPath id="right">
      <path d="M700 0 H1280 V720 H560 Z"/>
    </clipPath>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.42" stop-color="#050506" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#050506" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#050506" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4fb4"/>
      <stop offset="1" stop-color="#3fd8cf"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-10%" width="200%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- chapter 1: the statue moved into the left half -->
  <g clip-path="url(#left)">
    <image href="ch1.jpg" x="-330" y="-40" width="1422" height="800" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1280" height="720" fill="#120814" opacity="0.15"/>
  </g>
  <!-- chapter 2: the door in the right half -->
  <g clip-path="url(#right)">
    <image href="ch2.jpg" x="40" y="0" width="1280" height="720"/>
  </g>

  <!-- the seam between the chapters, a neon tube -->
  <line x1="700" y1="0" x2="560" y2="720" stroke="url(#seam)" stroke-width="10" filter="url(#glow)" opacity="0.8"/>
  <line x1="700" y1="0" x2="560" y2="720" stroke="url(#seam)" stroke-width="3"/>

  <rect width="1280" height="720" fill="url(#bottomShade)"/>

  <g font-family="Bahnschrift, 'Arial Narrow', sans-serif" filter="url(#shadow)" text-anchor="middle">
    <text x="640" y="540" font-size="40" font-weight="600" fill="#cfc9bd" letter-spacing="14">MYSTERY OF</text>
    <text x="640" y="646" font-size="130" font-weight="700" fill="#efe9dd" letter-spacing="4">PIZZAPLEX</text>
    <text x="640" y="692" font-size="24" font-weight="700" fill="#f2b134" letter-spacing="5">THE DEEP SECRETS   ·   THE DARK CORNERS</text>
  </g>

  <rect width="1280" height="720" fill="url(#vignette)"/>
</svg>
