<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: https: data:; media-src 'self' file:; style-src 'self'; script-src 'self'">
  <title>MG Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img class="brand-mark" src="assets/brand.png" alt="">
      <span>MG Launcher</span>
    </div>
    <div class="bar-right">
      <div id="music" class="music" hidden>
        <button id="music-toggle" class="music-toggle" type="button" aria-pressed="true" title="Музыка">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="speaker" d="M4 9h4l5-4v14l-5-4H4Z" />
            <path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" />
            <path class="cross" d="m16.5 9.5 5 5m0-5-5 5" />
          </svg>
        </button>
        <input id="music-volume" class="music-volume" type="range" min="0" max="100" step="1" aria-label="Громкость музыки">
      </div>
      <button id="nick-chip" class="nick-chip" type="button" hidden>
        <span class="nick-chip-label">Ник</span>
        <span id="nick-value" class="nick-chip-value"></span>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <dialog id="nick-dialog" class="nick-dialog">
    <form id="nick-form" method="dialog" novalidate>
      <h2>Как тебя звать в игре?</h2>
      <p class="nick-help">Этот ник увидят друзья в совместной игре. Его можно поменять потом.</p>
      <label class="field">
        <span class="field-label">Ник</span>
        <input id="nick-input" name="nick" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Например, Freddy_42">
      </label>
      <p id="nick-error" class="field-error" role="alert"></p>
      <p class="field-hint">3–16 символов: латинские буквы, цифры и _</p>
      <div class="dialog-actions">
        <button id="nick-cancel" class="btn-quiet" type="button">Отмена</button>
        <button class="btn-push" type="submit"><span>Сохранить</span></button>
      </div>
    </form>
  </dialog>

  <template id="tpl-library">
    <section class="library">
      <div class="studio">
        <img class="studio-logo" src="assets/studio-logo.png" alt="MINI Games Studio">
        <p class="studio-text">Сюжетные карты для Minecraft: хоррор, головоломки, игра с друзьями.</p>
      </div>
      <h1 class="library-title">Наши проекты</h1>
      <ul class="library-grid"></ul>
    </section>
  </template>

  <template id="tpl-card">
    <li>
      <button class="card" type="button">
        <img class="card-cover" alt="">
        <span class="card-label">
          <span class="card-title"></span>
          <span class="card-subtitle"></span>
        </span>
        <span class="card-state"><i class="lamp"></i><span class="card-state-text"></span></span>
      </button>
    </li>
  </template>

  <template id="tpl-game">
    <section class="game">
      <button class="back" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
        Все проекты
      </button>
      <div class="game-head">
        <h1 class="game-name"></h1>
        <p class="game-tagline"></p>
      </div>
      <div class="chapters" role="tablist" aria-label="Главы"></div>
      <div class="game-body">
        <div class="game-cover"><img alt=""></div>
        <div class="game-info">
          <h2 class="game-title"></h2>
          <p class="game-subtitle"></p>
          <ul class="game-facts"></ul>
          <div class="game-desc"></div>
          <div class="game-actions">
            <div class="game-buttons">
              <button class="btn-push btn-play" type="button"><span>Установить</span></button>
            </div>
            <div class="graphics" hidden>
              <span class="graphics-label">Графика</span>
              <div class="graphics-options" role="radiogroup" aria-label="Графика"></div>
              <p class="graphics-hint"></p>
            </div>
            <div class="progress" hidden><div class="progress-fill"></div></div>
            <p class="game-status" role="status"></p>
            <div class="host-panel" hidden>
              <p class="host-hint">Позвать друзей: в меню игры «Играть» → «Создать лобби». Адрес для друзей появится здесь.</p>
              <div class="host-address" hidden>
                <span class="host-address-label">Адрес для друзей</span>
                <code class="host-address-value"></code>
                <button class="btn-quiet host-copy" type="button">Копировать</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-error">
    <section class="notice">
      <h1>Список игр не загрузился</h1>
      <p class="notice-text"></p>
      <button class="btn-push" type="button"><span>Повторить</span></button>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
